<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Kintsu</title>

    <link rel="stylesheet" href="signin.css">
</head>
<body>

    <!-- Header / Nav - matches dashboard nav -->
    <header class="dash-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand" title="Return to Home">
                <div class="logo-box" aria-hidden="true">
                    <span class="logo-icon">✦</span>
                </div>
                <span class="logo-text">Kintsu</span>
            </a>

            <nav class="nav-pill-actions">
                <a href="dashboard.html" class="nav-pill outline-pill">Dashboard</a>
                <a href="index.html#live-demo" class="nav-pill outline-pill">Workspace</a>
                <a href="index.html#flashcards" class="nav-pill outline-pill">Flashcards</a>
                <button type="button" class="theme-toggle-btn" id="darkToggle" aria-label="Toggle dark mode">
                    <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>
                    <svg class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
                </button>
                <a href="signin.html" class="nav-pill active-pill">Sign in</a>
            </nav>
        </div>
    </header>

    <!-- Sign in card -->
    <main class="main">
        <div class="card">

            <div class="card-head">
                <span class="badge">SIGN IN</span>
                <h1 class="title">Welcome back</h1>
                <p class="subtitle">Kintsu &middot;</p>
            </div>

            <form class="form" id="signinForm" method="POST">
                <label class="label">
                    <span class="label-text">EMAIL</span>
                    <input class="input" type="email" name="email" required placeholder="name@domain.com" autocomplete="email">
                </label>

                <label class="label">
                    <span class="label-text">PASSWORD</span>
                    <input class="input" type="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                </label>

                <button class="submit" type="submit">SIGN IN</button>
            </form>

            <div class="divider">
                <span class="divider-line"></span>
                <span class="divider-text">OR</span>
                <span class="divider-line"></span>
            </div>

            <button type="button" id="googleBtn">Continue with Google</button>

            <div class="foot">
                <span class="foot-text">New here?</span>
                <a class="create" href="signup.html">Create an account</a>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
